<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PASSA TRIP - Procedimento</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           IMAGENS DOS PROCEDIMENTOS
        ====================================================== */

        #conteudo-despesa img {

            display: block;

            max-width: 100%;

            width: auto;

            height: auto;

            margin: 20px auto;

            cursor: zoom-in;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }



        #conteudo-despesa img:hover {

            transform: scale(1.01);

            box-shadow:
                0 8px 24px rgba(16, 24, 40, 0.15);

        }



        /* =====================================================
           MODAL DA IMAGEM
        ====================================================== */

        .modal-imagem {

            display: none;

            position: fixed;

            z-index: 99999;

            inset: 0;

            width: 100vw;

            height: 100vh;

            background:
                rgba(15, 23, 42, 0.88);

            align-items: center;

            justify-content: center;

            padding: 30px;

            box-sizing: border-box;

        }



        .modal-imagem.aberta {

            display: flex;

        }



        .modal-imagem img {

            display: block;

            max-width: 95vw;

            max-height: 92vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);

            background: #FFFFFF;

            cursor: default;

        }



        /* =====================================================
           BOTÃO FECHAR IMAGEM
        ====================================================== */

        .fechar-imagem {

            position: absolute;

            top: 18px;

            right: 25px;

            color: #FFFFFF;

            font-size: 36px;

            font-weight: 700;

            cursor: pointer;

            line-height: 1;

            z-index: 100000;

        }

    </style>

</head>



<body>



<header>

    <h1>PASSA TRIP</h1>

    <p>
        Manual interativo do SAP Concur
    </p>

</header>



<main>

    <div class="pagina-procedimento">


        <!-- =================================================
             BOTÃO VOLTAR
        ================================================== -->

        <button
            class="botao-voltar"
            onclick="voltarInicio()"
        >

            ⬅️ Voltar

        </button>



        <!-- =================================================
             CONTEÚDO
        ================================================== -->

        <div id="conteudo-despesa">

            <h2>Carregando...</h2>

        </div>



    </div>

</main>



<!-- =========================================================
     MODAL PARA AMPLIAR IMAGENS
========================================================= -->

<div
    id="modal-imagem"
    class="modal-imagem"
>

    <span
        id="fechar-imagem"
        class="fechar-imagem"
    >

        ×

    </span>



    <img
        id="imagem-ampliada"
        src=""
        alt="Imagem ampliada"
    >

</div>

/* =========================================================
   PEGAR O TIPO DA PÁGINA
========================================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );



const tipo =
    parametros.get("tipo");



const conteudo =
    document.getElementById(
        "conteudo-despesa"
    );



/* =========================================================
   FUNÇÃO PARA MOSTRAR PROCEDIMENTO
========================================================= */

function mostrarProcedimento(titulo, html) {

    document.title =
        "PASSA TRIP - " + titulo;

    conteudo.innerHTML =
        html;

}

========================================================= */

            Passo 1
        </h3>

            <strong>Google Chrome</strong>.
        </p>

        <p>

            Passo 2

            Passo 3

        <h3>Passo 3 — Selecionar a pessoa</h3>

        <p>
            A partir desse momento, você poderá realizar

            <strong>💡 DICA</strong>

                autorize outra pessoa a ser responsável por

        `
    );

/* =========================================================
   AMPLIAR IMAGEM
========================================================= */

function abrirImagem(imagem) {

    const modal =
        document.getElementById(
            "modal-imagem"
        );



    const imagemAmpliada =
        document.getElementById(
            "imagem-ampliada"
        );



    if (
        !modal ||
        !imagemAmpliada ||
        !imagem
    ) {

        return;

    }



    imagemAmpliada.src =
        imagem.currentSrc ||
        imagem.src;



    imagemAmpliada.alt =
        imagem.alt ||
        "Imagem ampliada";



    modal.classList.add(
        "aberta"
    );



    document.body.style.overflow =
        "hidden";

}



/* =========================================================
   FECHAR IMAGEM
========================================================= */

function fecharImagem() {

    const modal =
        document.getElementById(
            "modal-imagem"
        );



    const imagemAmpliada =
        document.getElementById(
            "imagem-ampliada"
        );



    if (!modal) {

        return;

    }



    modal.classList.remove(
        "aberta"
    );



    document.body.style.overflow =
        "";



    if (imagemAmpliada) {

        imagemAmpliada.src =
            "";

    }

}



/* =========================================================
   CLIQUE NAS IMAGENS
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const imagem =
            event.target.closest(
                "#conteudo-despesa img"
            );



        if (!imagem) {

            return;

        }



        event.preventDefault();



        abrirImagem(imagem);

    }
);



/* =========================================================
   FECHAR CLICANDO NO FUNDO
========================================================= */

const modalImagem =
    document.getElementById(
        "modal-imagem"
    );



if (modalImagem) {

    modalImagem.addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                fecharImagem();

            }

        }
    );

}



/* =========================================================
   FECHAR NO X
========================================================= */

const botaoFechar =
    document.getElementById(
        "fechar-imagem"
    );



if (botaoFechar) {

    botaoFechar.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();

            fecharImagem();

        }
    );

}



/* =========================================================
   NÃO FECHAR AO CLICAR NA IMAGEM AMPLIADA
========================================================= */

const imagemAmpliada =
    document.getElementById(
        "imagem-ampliada"
    );



if (imagemAmpliada) {

    imagemAmpliada.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

        }
    );

}



/* =========================================================
   FECHAR COM ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            fecharImagem();

        }

    }
);



/* =========================================================
   VOLTAR PARA O INÍCIO
========================================================= */

function voltarInicio() {

    window.location.href =
        "index.html";

}
