<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CONCUR GUIDE - Procedimento</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           IMAGENS DOS PROCEDIMENTOS
        ====================================================== */

        #conteudo-despesa img {

            display: block;

            max-width: 100%;

            width: auto;

            height: auto;

            margin: 20px auto;

            cursor: zoom-in;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }



        #conteudo-despesa img:hover {

            transform: scale(1.01);

            box-shadow:
                0 8px 24px rgba(16, 24, 40, 0.15);

        }



        /* =====================================================
           MODAL DA IMAGEM
        ====================================================== */

        .modal-imagem {

            display: none;

            position: fixed;

            z-index: 99999;

            inset: 0;

            width: 100vw;

            height: 100vh;

            background:
                rgba(15, 23, 42, 0.88);

            align-items: center;

            justify-content: center;

            padding: 30px;

            box-sizing: border-box;

        }



        .modal-imagem.aberta {

            display: flex;

        }



        .modal-imagem img {

            display: block;

            max-width: 95vw;

            max-height: 92vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);

            background: #FFFFFF;

            cursor: default;

        }



        /* =====================================================
           BOTÃO FECHAR IMAGEM
        ====================================================== */

        .fechar-imagem {

            position: absolute;

            top: 18px;

            right: 25px;

            color: #FFFFFF;

            font-size: 36px;

            font-weight: 700;

            cursor: pointer;

            line-height: 1;

            z-index: 100000;

        }

    </style>

</head>



<body>



<header>

    <h1>CONCUR GUIDE</h1>

    <p>
        Manual interativo do SAP Concur
    </p>

</header>



<main>

    <div class="pagina-procedimento">


        <!-- =================================================
             BOTÃO VOLTAR
        ================================================== -->

        <button
            class="botao-voltar"
            onclick="voltarInicio()"
        >

            ⬅️ Voltar

        </button>



        <!-- =================================================
             CONTEÚDO
        ================================================== -->

        <div id="conteudo-despesa">

            <h2>Carregando...</h2>

        </div>



    </div>

</main>



<!-- =========================================================
     MODAL PARA AMPLIAR IMAGENS
========================================================= -->

<div
    id="modal-imagem"
    class="modal-imagem"
>

    <span
        id="fechar-imagem"
        class="fechar-imagem"
    >

        ×

    </span>



    <img
        id="imagem-ampliada"
        src=""
        alt="Imagem ampliada"
    >

</div>



<script>

/* =========================================================
   PEGAR O TIPO DA PÁGINA
========================================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );



const tipo =
    parametros.get("tipo");



const conteudo =
    document.getElementById(
        "conteudo-despesa"
    );



/* =========================================================
   FUNÇÃO PARA MOSTRAR PROCEDIMENTO
========================================================= */

function mostrarProcedimento(titulo, html) {

    document.title =
        "CONCUR GUIDE - " + titulo;

    conteudo.innerHTML =
        html;

}



/* =========================================================
   ACESSO
========================================================= */

if (tipo === "acesso") {

    mostrarProcedimento(
        "Acesso",
        `

        <h2>
            🔐 Como acessar o SAP Concur
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Copie o link de acesso ao SAP Concur
            e cole no navegador
            <strong>Google Chrome</strong>.
        </p>

        <p>
            <a
                href="https://us2.concursolutions.com/nui/signin/hrd"
                target="_blank"
                rel="noopener noreferrer"
            >
                Acessar o SAP Concur
            </a>
        </p>

        <img
            src="Imagens/Acesso/1.png"
            alt="Acesso ao SAP Concur"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Preencha seu
            <strong>e-mail corporativo</strong>
            no campo de acesso.
        </p>

        <img
            src="Imagens/Acesso/2.png"
            alt="E-mail corporativo"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Clique em
            <strong>Seguinte</strong>
            e depois em
            <strong>Microsoft Login</strong>.
        </p>

        <img
            src="Imagens/Acesso/3.png"
            alt="Microsoft Login"
        >

        `
    );

}


/* =========================================================
   ADIANTAMENTO
========================================================= */

else if (tipo === "adiantamento") {

    mostrarProcedimento(
        "Adiantamento",
        `

        <h2>
            💳 Como criar um adiantamento
        </h2>

        <h3>Passo 1</h3>

        <p>
            Clique em <strong>Solicitações</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/1.png"
            alt="Menu Solicitações"
        >

        <h3>Passo 2</h3>

        <p>
            Acesse a área de <strong>Solicitações</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/2.png"
            alt="Solicitações"
        >

        <h3>Passo 3</h3>

        <p>
            Clique em <strong>Criar solicitação</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/3.png"
            alt="Criar solicitação"
        >

        <h3>Passo 4</h3>

        <p>
            Preencha os campos obrigatórios
            e clique em <strong>Criar solicitação</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/4.png"
            alt="Preenchimento da solicitação"
        >

        <h3>Passo 5</h3>

        <p>
            Clique em <strong>Adicionar adiantamento</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/5.png"
            alt="Adicionar adiantamento"
        >

        <h3>Passo 6</h3>

        <p>
            Preencha o <strong>valor do adiantamento</strong>
            e a justificativa. Em seguida, clique em
            <strong>Salvar</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/6.png"
            alt="Valor do adiantamento"
        >

        <h3>Passo 7</h3>

        <p>
            Revise as informações e clique em
            <strong>Enviar solicitação</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/7.png"
            alt="Enviar solicitação"
        >

        `
    );

}

/* =========================================================
   CONSULTA DE ADIANTAMENTOS EM ABERTO - F-44
========================================================= */

else if (tipo === "consulta-f44") {

    mostrarProcedimento(
        "Consulta de Adiantamentos em Aberto (F-44)",
        `

        <h2>
            🔎 Como consultar adiantamentos em aberto para realizar a F-44
        </h2>

        <h3>
            Passo 1 — Acessar a transação
        </h3>

        <p>
            Acesse a transação <strong>ZFI0107</strong>
            e preencha os campos conforme as orientações:
        </p>

        <p>
            <strong>Empresa:</strong> 1000 ou 2000
            <br>
            <strong>Exercício:</strong> 2026
            <br>
            <strong>Tipo de Documento:</strong> C5
            <br>
            <strong>Local de Negócio:</strong> informe o correspondente à sua unidade.
        </p>

        <p>
            Após preencher os campos, clique em
            <strong>Executar</strong> (ícone do relógio).
        </p>

        <img
            src="Imagens/Consulta F-44 em Aberto/1.png"
            alt="Preenchimento dos campos da transação ZFI0107"
        >

        <h3>
            Passo 2 — Filtrar a chave de lançamento
        </h3>

        <p>
            Na coluna <strong>Chave de Lançamento</strong>,
            serão exibidos diferentes números.
            Para localizar os lançamentos desejados,
            clique no ícone de <strong>Funil</strong>.
        </p>

        <img
            src="Imagens/Consulta F-44 em Aberto/2.png"
            alt="Aplicar filtro na coluna Chave de Lançamento"
        >

        <h3>
            Passo 3 — Informar o filtro
        </h3>

        <p>
            Nas duas caixas de seleção do filtro,
            informe o número <strong>21</strong>
            e clique em <strong>Prosseguir</strong>.
        </p>

        <img
            src="Imagens/Consulta F-44 em Aberto/3.png"
            alt="Informar a chave de lançamento 21 no filtro"
        >

        <h3>
            Passo 4 — Identificar os adiantamentos em aberto
        </h3>

        <p>
            Após aplicar o filtro, serão exibidas as transações
            com <strong>chave de lançamento 21</strong>.
            Todos os lançamentos apresentados nessa consulta
            devem ser tratados por meio da transação
            <strong>F-44</strong>.
        </p>

        <img
            src="Imagens/Consulta F-44 em Aberto/4.png"
            alt="Resultado da consulta com chave de lançamento 21"
        >

        <div class="dica">

            💡 <strong>Dica importante</strong>

            <br><br>

            Utilize essa consulta para identificar os
            adiantamentos que ainda precisam ser compensados
            por meio da transação <strong>F-44</strong>.

            <br><br>

            Confira os lançamentos apresentados antes de
            realizar os procedimentos de compensação.

        </div>

        `
    );

}

/* =========================================================
   PRESTAÇÃO DE CONTAS
========================================================= */

else if (tipo === "prestacao-contas") {

    mostrarProcedimento(
        "Prestação de Contas",
        `

        <h2>
            📋 Como realizar a Prestação de Contas
        </h2>

        <h3>
            Passo 1 – Acessar os relatórios
        </h3>

        <p>
            Clique em <strong>Solicitações</strong> e, em seguida,
            em <strong>Gerenciar Solicitações</strong>.
        </p>

        <img
            src="Imagens/Prestação de Contas/1.png"
            alt="Acessar Gerenciar Relatórios"
        >

        <h3>
            Passo 2 – Selecionar o adiantamento
        </h3>

        <p>
            Clique no <strong>card</strong> correspondente
            ao adiantamento que deseja prestar contas.
        </p>

        <img
            src="Imagens/Prestação de Contas/2.png"
            alt="Selecionar o adiantamento correspondente"
        >

        <h3>
            Passo 3 – Criar o relatório de despesas
        </h3>

        <p>
            Clique em <strong>Criar relatório de despesa</strong>.
        </p>

        <div style="
            background-color: #F3F4F6;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            padding: 14px 18px;
            margin: 20px 0 25px;
            color: #344054;
        ">

            <p style="margin: 0; line-height: 1.6;">
                <strong>⚠️ Atenção:</strong> não clique em
                <strong>Fechar solicitação</strong>.
                Utilize somente a opção
                <strong>Criar relatório de despesa</strong>.
            </p>

        </div>

        <img
            src="Imagens/Prestação de Contas/3.png"
            alt="Criar relatório de despesa"
        >

        <h3>
            Passo 4 – Adicionar as despesas
        </h3>

        <p>
            Observe que o adiantamento já estará vinculado
            ao relatório. Clique em <strong>Adicionar despesas</strong>
            para incluir os lançamentos.
        </p>

        <p>
            Caso tenha dúvidas sobre como lançar as despesas,
            volte à tela anterior e acesse a seção
            <strong>Despesas</strong>, onde encontrará o passo a passo
            de cada procedimento.
        </p>

        <img
            src="Imagens/Prestação de Contas/4.png"
            alt="Adicionar despesas ao relatório"
        >

        <h3>
            Passo 5 – Conferir a necessidade de devolução
        </h3>

        <p>
            Após incluir todas as despesas, confira se existe
            algum valor a ser devolvido à empresa.
        </p>

        <p>
            Caso exista valor a devolver, será necessário adicionar
            a despesa <strong>Devolução de adiantamento</strong>.
            Caso contrário, basta enviar o relatório.
        </p>

        <img
            src="Imagens/Prestação de Contas/5.png"
            alt="Conferir a necessidade de devolução"
        >

        <h3>
            Passo 6 – Adicionar a devolução de adiantamento
        </h3>

        <p>
            Clique em <strong>Adicionar despesa</strong> e procure
            pela opção <strong>Devolução de adiantamento</strong>.
        </p>

        <p>
            Essa opção fica habilitada somente quando há necessidade
            de devolver valores à empresa.
        </p>

        <img
            src="Imagens/Prestação de Contas/6.png"
            alt="Adicionar despesa de devolução de adiantamento"
        >

        <h3>
            Passo 7 – Preencher os dados da devolução
        </h3>

        <p>
            Informe a <strong>data</strong> em que o depósito foi realizado
            e o <strong>valor exato</strong> que está sendo devolvido.
        </p>

        <p>
            O valor informado deve corresponder exatamente ao saldo
            devido. Não informe valores acima ou abaixo do necessário.
        </p>

        <p>
            Anexe o <strong>comprovante de Depósito</strong> e clique
            em <strong>Salvar</strong>.
        </p>

        <img
            src="Imagens/Prestação de Contas/7.png"
            alt="Preencher os dados e anexar o comprovante de depósito"
        >

        <h3>
            Passo 8 – Enviar o relatório
        </h3>

        <p>
            Após adicionar a devolução, clique em
            <strong>Enviar relatório</strong>.
        </p>

        <img
            src="Imagens/Prestação de Contas/8.png"
            alt="Enviar relatório de despesas"
        >

        <h3>
            Passo 9 – Concluir o envio
        </h3>

        <p>
            Na tela seguinte, clique em <strong>Continuar</strong>
            para finalizar o procedimento.
        </p>

        <img
            src="Imagens/Prestação de Contas/9.png"
            alt="Continuar para finalizar o envio"
        >

        <div class="dica">

            💡 <strong>Dicas importantes</strong>

            <br><br>

            Realize a <strong>Prestação de Contas</strong>
            o quanto antes.

            <br><br>

            Anexe sempre o comprovante do <strong>Depósito</strong>
            e informe a data em que ele foi efetivamente realizado.

        </div>

        `
    );

}


/* =========================================================
   F-44 — BAIXA DE DEVOLUÇÃO DE ADIANTAMENTO
========================================================= */

else if (tipo === "f44") {

    mostrarProcedimento(
        "F-44 — Baixa de Devolução de Adiantamento",
        `

        <h2>
            ↔️ Como realizar a baixa de devolução de adiantamento — F-44
        </h2>

        <div style="
            background-color: #F3F4F6;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            padding: 14px 18px;
            margin: 20px 0 25px;
            color: #344054;
        ">

            <p style="margin: 0; line-height: 1.6;">
                <strong>ℹ️ A transação F-44</strong> deve ser realizada
                exclusivamente quando o <strong>funcionário</strong>
                efetuar a <strong>Devolução</strong> de valores à
                <strong>Empresa</strong>.
            </p>

        </div>

        <h3>
            Passo 1 – Identificar o funcionário e consultar os itens
        </h3>

        <p>
            Preencha os campos conforme as orientações:
        </p>

        <ul>
            <li><strong>BP:</strong> informe o BP do funcionário.</li>
            <li><strong>Empresa:</strong> informe 1000 (SENAI) ou 2000 (SESI).</li>
            <li><strong>Viagem:</strong> informe a letra V.</li>
            <li><strong>PA Normais:</strong> mantenha a opção marcada.</li>
            <li><strong>Seleção:</strong> escolha a opção Nenhum.</li>
            <li><strong>Data:</strong> informe sempre a data em que o <strong>Depósito</strong> foi realizado.</li>
        </ul>

        <p>
            Após preencher os campos, clique em
            <strong>Processar PA</strong>.
        </p>

        <img
            src="Imagens/F-44/1.png"
            alt="Identificar funcionário e consultar itens na F-44"
        >

        <h3>
            Passo 2 – Selecionar o valor devolvido
        </h3>

        <p>
            Na tela apresentada, selecione a linha correspondente
            ao valor devolvido, deixando-a destacada em azul.
        </p>

        <p>
            Em seguida, clique em
            <strong>Dar baixa à diferença</strong>.
        </p>

        <img
            src="Imagens/F-44/2.png"
            alt="Selecionar o valor devolvido"
        >

        <h3>
            Passo 3 – Informar a chave e a conta contábil
        </h3>

        <p>
            Preencha os campos conforme a empresa:
        </p>

        <ul>
            <li><strong>Chave:</strong> 40.</li>
            <li><strong>Conta contábil SENAI:</strong> 12011.</li>
            <li><strong>Conta contábil SESI:</strong> 11011.</li>
        </ul>

        <p>
            Após preencher as informações, clique em
            <strong>Processar PA</strong>.
        </p>

        <img
            src="Imagens/F-44/3.png"
            alt="Informar chave e conta contábil"
        >

        <h3>
            Passo 4 – Preencher os dados da devolução
        </h3>

        <p>
            Informe os seguintes dados:
        </p>

        <ul>
            <li><strong>Montante:</strong> valor efetivamente devolvido pelo funcionário.</li>
            <li><strong>Local de negócio:</strong> informe o local correspondente.</li>
            <li><strong>Data efetiva:</strong> informe a data em que o <strong>Depósito</strong> foi realizado.</li>
            <li><strong>Texto:</strong> Devolução de Adiantamento.</li>
        </ul>

        <p>
            Após preencher todos os campos, clique em
            <strong>Processar PA</strong>.
        </p>

        <img
            src="Imagens/F-44/4.png"
            alt="Preencher os dados da devolução"
        >

        <h3>
            Passo 5 – Simular o documento
        </h3>

        <p>
            Verifique se o saldo apresentado está zerado.
        </p>

        <p>
            Em seguida, acesse <strong>Documento</strong>
            e clique em <strong>Simular</strong>.
        </p>

        <img
            src="Imagens/F-44/5.png"
            alt="Conferir saldo e simular documento"
        >

        <h3>
            Passo 6 – Selecionar a linha do documento
        </h3>

        <p>
            Na tela de simulação, dê duplo clique sobre
            a linha destacada em azul.
        </p>

        <img
            src="Imagens/F-44/6.png"
            alt="Selecionar linha do documento"
        >

        <h3>
            Passo 7 – Salvar o documento
        </h3>

        <p>
            Clique em <strong>Salvar</strong>.
        </p>

        <p>
            Após a gravação, será exibida uma mensagem
            de confirmação. Pressione <strong>Enter</strong>
            para finalizar o procedimento.
        </p>

        <img
            src="Imagens/F-44/7.png"
            alt="Salvar documento da F-44"
        >

        <div class="dica">

            💡 <strong>Dicas importantes</strong>

            <br><br>

            Não se esqueça de <strong>anexar</strong> o comprovante de
            <strong>Depósito</strong> na transação
            <strong>FB03</strong>.

            <br><br>

            Realize sempre a F-44 considerando a data
            em que o <strong>Depósito</strong> foi efetuado.

        </div>

        `
    );

}



/* =========================================================
   REEMBOLSO
========================================================= */

else if (tipo === "reembolso") {

    mostrarProcedimento(
        "Reembolso",
        `

        <h2>
            💵 Como criar um reembolso
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Clique em
            <strong>Despesas</strong>.
        </p>

        <img
            src="Imagens/Reembolso/1.png"
            alt="Menu Despesas"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Clique em
            <strong>Gerenciar despesas</strong>.
        </p>

        <img
            src="Imagens/Reembolso/2.png"
            alt="Gerenciar despesas"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Clique em
            <strong>Criar relatório de despesas</strong>.
        </p>

        <img
            src="Imagens/Reembolso/3.png"
            alt="Criar relatório"
        >



        <h3>
            Passo 4
        </h3>

        <p>
            Preencha os campos obrigatórios,
            selecione
            <strong>
                Não, não preciso de ajuda de custo
            </strong>
            e clique em
            <strong>Criar relatório</strong>.
        </p>

        <img
            src="Imagens/Reembolso/4.png"
            alt="Preenchimento do relatório de reembolso"
        >



        <div class="dica">

            💡 <strong>Importante</strong>

            <br><br>

            Utilize esta opção para solicitar
            o reembolso de despesas quando não houver
            solicitação de adiantamento vinculada à viagem.

        </div>

        `
    );

}

/* =========================================================
   RECIBO AUTOMÁTICO
========================================================= */

else if (tipo === "recibo-automatico") {

    mostrarProcedimento(
        "Recibo Automático",
        `

        <h2>
            🧾 Como lançar uma despesa utilizando o Recibo Automático
        </h2>

        <h3>
            Passo 1 — Carregar recibos
        </h3>

        <p>
            Clique em <strong>Carregar Recibos</strong>
            para iniciar a inclusão do documento.
        </p>

        <img
            src="Imagens/Recibo Automático/1.png"
            alt="Carregar recibos"
        >

        <h3>
            Passo 2 — Selecionar o recibo
        </h3>

        <p>
            Selecione, em seu computador, o
            <strong>recibo</strong> que deseja incluir
            e clique em <strong>Abrir</strong>.
        </p>

        <img
            src="Imagens/Recibo Automático/2.png"
            alt="Selecionar recibo no computador"
        >

        <h3>
            Passo 3 — Verificar a despesa
        </h3>

        <p>
            Após a inclusão do recibo e a geração da despesa,
            clique sobre ela para <strong>verificar as informações</strong>.
        </p>

        <img
            src="Imagens/Recibo Automático/3.png"
            alt="Verificar despesa incluída"
        >

        <h3>
            Passo 4 — Conferir e salvar
        </h3>

        <p>

/* =========================================================
   PESQUISA — RC-04/2026
========================================================= */

function filtrarRC04() {

    const campo = document.getElementById("busca-rc04");

    const itens = document.querySelectorAll(".rc04-item");

    const mensagem = document.getElementById("nenhum-resultado-rc04");

    if (!campo || !mensagem) {
        return;
    }

    const pesquisa = campo.value
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

    let encontrados = 0;

    itens.forEach(function(item) {

        const texto = (
            item.innerText + " " +
            item.getAttribute("data-termos")
        )
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

        const corresponde = texto.includes(pesquisa);

        item.style.display = corresponde ? "block" : "none";

        if (corresponde) {
            encontrados++;
        }

    });

    mensagem.style.display =
        encontrados === 0 ? "block" : "none";

}

/* =========================================================
   AMPLIAR TODAS AS IMAGENS DOS PROCEDIMENTOS
========================================================= */

const modalImagem = document.getElementById("modal-imagem");
const imagemAmpliada = document.getElementById("imagem-ampliada");
const fecharModalImagem = document.getElementById("fechar-imagem");


/* ABRIR IMAGEM AO CLICAR */

document.addEventListener("click", function(event) {

    const imagem = event.target.closest("#conteudo-despesa img");

    if (!imagem || !modalImagem || !imagemAmpliada) {
        return;
    }

    imagemAmpliada.src = imagem.src;
    imagemAmpliada.alt = imagem.alt || "Imagem ampliada";

    modalImagem.style.display = "flex";
    document.body.style.overflow = "hidden";

});


/* FECHAR PELO BOTÃO X */

if (fecharModalImagem) {

    fecharModalImagem.addEventListener("click", function(event) {

        event.stopPropagation();

        modalImagem.style.display = "none";
        imagemAmpliada.src = "";

        document.body.style.overflow = "";

    });

}


/* NÃO FECHAR AO CLICAR NA IMAGEM AMPLIADA */

if (imagemAmpliada) {

    imagemAmpliada.addEventListener("click", function(event) {

        event.stopPropagation();

    });

}


/* FECHAR AO CLICAR FORA DA IMAGEM */

if (modalImagem) {

    modalImagem.addEventListener("click", function() {

        modalImagem.style.display = "none";
        imagemAmpliada.src = "";

        document.body.style.overflow = "";

    });

}


/* FECHAR COM ESC */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape" && modalImagem) {

        modalImagem.style.display = "none";
        imagemAmpliada.src = "";

        document.body.style.overflow = "";

    }

});

/* =========================================================
   VOLTAR PARA O INÍCIO
========================================================= */

function voltarInicio() {

    window.location.href =
        "index.html";

}
