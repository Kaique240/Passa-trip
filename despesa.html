<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PASSA TRIP - Procedimento</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           IMAGENS DOS PROCEDIMENTOS
        ====================================================== */

        #conteudo-despesa img {

            display: block;

            max-width: 100%;

            width: auto;

            height: auto;

            margin: 20px auto;

            cursor: zoom-in;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }



        #conteudo-despesa img:hover {

            transform: scale(1.01);

            box-shadow:
                0 8px 24px rgba(16, 24, 40, 0.15);

        }



        /* =====================================================
           MODAL DA IMAGEM
        ====================================================== */

        .modal-imagem {

            display: none;

            position: fixed;

            z-index: 99999;

            inset: 0;

            width: 100vw;

            height: 100vh;

            background:
                rgba(15, 23, 42, 0.88);

            align-items: center;

            justify-content: center;

            padding: 30px;

            box-sizing: border-box;

        }



        .modal-imagem.aberta {

            display: flex;

        }



        .modal-imagem img {

            display: block;

            max-width: 95vw;

            max-height: 92vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);

            background: #FFFFFF;

            cursor: default;

        }



        /* =====================================================
           BOTÃO FECHAR IMAGEM
        ====================================================== */

        .fechar-imagem {

            position: absolute;

            top: 18px;

            right: 25px;

            color: #FFFFFF;

            font-size: 36px;

            font-weight: 700;

            cursor: pointer;

            line-height: 1;

            z-index: 100000;

        }

    </style>

</head>



<body>



<header>

    <h1>PASSA TRIP</h1>

    <p>
        Manual interativo do SAP Concur
    </p>

</header>



<main>

    <div class="pagina-procedimento">


        <!-- =================================================
             BOTÃO VOLTAR
        ================================================== -->

        <button
            class="botao-voltar"
            onclick="voltarInicio()"
        >

            ⬅️ Voltar

        </button>



        <!-- =================================================
             CONTEÚDO
        ================================================== -->

        <div id="conteudo-despesa">

            <h2>Carregando...</h2>

        </div>



    </div>

</main>



<!-- =========================================================
     MODAL PARA AMPLIAR IMAGENS
========================================================= -->

<div
    id="modal-imagem"
    class="modal-imagem"
>

    <span
        id="fechar-imagem"
        class="fechar-imagem"
    >

        ×

    </span>



    <img
        id="imagem-ampliada"
        src=""
        alt="Imagem ampliada"
    >

</div>



<script>

/* =========================================================
   PEGAR O TIPO DA PÁGINA
========================================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );



const tipo =
    parametros.get("tipo");



const conteudo =
    document.getElementById(
        "conteudo-despesa"
    );



/* =========================================================
   FUNÇÃO PARA MOSTRAR PROCEDIMENTO
========================================================= */

function mostrarProcedimento(titulo, html) {

    document.title =
        "PASSA TRIP - " + titulo;

    conteudo.innerHTML =
        html;

}



/* =========================================================
   ACESSO
========================================================= */

if (tipo === "acesso") {

    mostrarProcedimento(
        "Acesso",
        `

        <h2>
            🔐 Como acessar o SAP Concur
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Copie o link de acesso ao SAP Concur
            e cole no navegador
            <strong>Google Chrome</strong>.
        </p>

        <p>
            <a
                href="https://us2.concursolutions.com/nui/signin/hrd"
                target="_blank"
                rel="noopener noreferrer"
            >
                Acessar o SAP Concur
            </a>
        </p>

        <img
            src="Imagens/Acesso/1.png"
            alt="Acesso ao SAP Concur"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Preencha seu
            <strong>e-mail corporativo</strong>
            no campo de acesso.
        </p>

        <img
            src="Imagens/Acesso/2.png"
            alt="E-mail corporativo"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Clique em
            <strong>Seguinte</strong>
            e depois em
            <strong>Microsoft Login</strong>.
        </p>

        <img
            src="Imagens/Acesso/3.png"
            alt="Microsoft Login"
        >

        `
    );

}



/* =========================================================
   ADIANTAMENTO
========================================================= */

else if (tipo === "adiantamento") {

    mostrarProcedimento(
        "Adiantamento",
        `

        <h2>
            💳 Como criar um adiantamento
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Clique em
            <strong>Solicitações</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/1.png"
            alt="Menu Solicitações"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Acesse a área de
            <strong>Solicitações</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/2.png"
            alt="Solicitações"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Clique em
            <strong>Criar solicitação</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/3.png"
            alt="Criar solicitação"
        >



        <h3>
            Passo 4
        </h3>

        <p>
            Preencha os campos obrigatórios
            e clique em
            <strong>Criar solicitação</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/4.png"
            alt="Preenchimento da solicitação"
        >



        <h3>
            Passo 5
        </h3>

        <p>
            Clique em
            <strong>Adicionar adiantamento</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/5.png"
            alt="Adicionar adiantamento"
        >



        <h3>
            Passo 6
        </h3>

        <p>
            Preencha o
            <strong>valor do adiantamento</strong>
            e a justificativa.
            Em seguida, clique em
            <strong>Salvar</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/6.png"
            alt="Valor do adiantamento"
        >



        <h3>
            Passo 7
        </h3>

        <p>
            Revise as informações e clique em
            <strong>Enviar solicitação</strong>.
        </p>

        <img
            src="Imagens/Adiantamento/7.png"
            alt="Enviar solicitação"
        >

        `
    );

}



/* =========================================================
   REEMBOLSO
========================================================= */

else if (tipo === "reembolso") {

    mostrarProcedimento(
        "Reembolso",
        `

        <h2>
            💵 Como criar um reembolso
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Clique em
            <strong>Despesas</strong>.
        </p>

        <img
            src="Imagens/Reembolso/1.png"
            alt="Menu Despesas"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Clique em
            <strong>Gerenciar despesas</strong>.
        </p>

        <img
            src="Imagens/Reembolso/2.png"
            alt="Gerenciar despesas"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Clique em
            <strong>Criar relatório de despesas</strong>.
        </p>

        <img
            src="Imagens/Reembolso/3.png"
            alt="Criar relatório"
        >



        <h3>
            Passo 4
        </h3>

        <p>
            Preencha os campos obrigatórios,
            selecione
            <strong>
                Não, não preciso de ajuda de custo
            </strong>
            e clique em
            <strong>Criar relatório</strong>.
        </p>

        <img
            src="Imagens/Reembolso/4.png"
            alt="Preenchimento do relatório de reembolso"
        >



        <div class="dica">

            💡 <strong>Importante</strong>

            <br><br>

            Utilize esta opção para solicitar
            o reembolso de despesas quando não houver
            solicitação de adiantamento vinculada à viagem.

        </div>

        `
    );

}



/* =========================================================
   ALMOÇO
========================================================= */

else if (tipo === "almoco") {

    mostrarProcedimento(
        "Almoço",
        `

        <h2>
            🍽️ Como lançar uma despesa de almoço
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Clique em
            <strong>Criação do Manual de Despesa</strong>.
        </p>

        <img
            src="Imagens/Almoço/1.png"
            alt="Criação do Manual de Despesa"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Pesquise por
            <strong>Almoço</strong>
            e selecione a opção exibida.
        </p>

        <img
            src="Imagens/Almoço/2.png"
            alt="Selecionar Almoço"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Preencha os campos obrigatórios
            e clique em
            <strong>Salvar</strong>.
        </p>

        <img
            src="Imagens/Almoço/3.png"
            alt="Preencher despesa de almoço"
        >



        <div class="dica">

            💡 <strong>Importante</strong>

            <br><br>

            Informe no campo
            <strong>Comentários</strong>
            se veio à
            <strong>Sede</strong>
            e descreva o motivo da refeição.

            <br><br>

            Conforme a
            <strong>RC-04/2026</strong>,
            não é necessário anexar o comprovante fiscal
            para esta despesa.

        </div>

        `
    );

}



/* =========================================================
   BEBIDAS NÃO-ALCOÓLICAS
========================================================= */

else if (tipo === "bebida") {

    mostrarProcedimento(
        "Bebidas Não-Alcoólicas",
        `

        <h2>
            🥤 Como lançar uma despesa de bebida não alcoólica
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Clique em
            <strong>Criação do Manual de Despesa</strong>.
        </p>

        <img
            src="Imagens/Bebidas Não-Alcoólica/1.png"
            alt="Criação do Manual de Despesa"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Pesquise por
            <strong>Bebida</strong>
            e selecione
            <strong>Bebida Não-Alcoólica</strong>.
        </p>

        <img
            src="Imagens/Bebidas Não-Alcoólica/2.png"
            alt="Bebida Não-Alcoólica"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Preencha os campos obrigatórios
            e clique em
            <strong>Salvar</strong>.
        </p>

        <img
            src="Imagens/Bebidas Não-Alcoólica/3.png"
            alt="Preenchimento da bebida"
        >



        <div class="dica">

            💡 <strong>Importante</strong>

            <br><br>

            Conforme a
            <strong>RC-04/2026</strong>,
            é necessário anexar o comprovante fiscal
            para esta despesa.

             <br><br>
            O comprovante deve ser anexado
            em formato <strong>PDF</strong>.

        </div>

        `
    );

}



/* =========================================================
   JANTAR
========================================================= */

else if (tipo === "jantar") {

    mostrarProcedimento(
        "Jantar",
        `

        <h2>
            🍔 Como lançar uma despesa de jantar
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Clique em
            <strong>Criação do Manual de Despesa</strong>.
        </p>

        <img
            src="Imagens/Jantar/1.png"
            alt="Criação do Manual de Despesa"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Pesquise por
            <strong>Jantar</strong>
            e selecione a opção exibida.
        </p>

        <img
            src="Imagens/Jantar/2.png"
            alt="Selecionar Jantar"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Preencha os campos obrigatórios
            e clique em
            <strong>Salvar</strong>.
        </p>

        <img
            src="Imagens/Jantar/3.png"
            alt="Preencher despesa de jantar"
        >



        <div class="dica">

            💡 <strong>Importante</strong>

            <br><br>

            Informe no campo
            <strong>Comentários</strong>
            se veio à
            <strong>Sede</strong>
            e descreva o motivo da refeição.

            <br><br>

            Conforme a
            <strong>RC-04/2026</strong>,
            não é necessário anexar o comprovante fiscal
            para esta despesa.

        </div>

        `
    );

}

/* =========================================================
   LANCHE
========================================================= */

else if (tipo === "lanche") {

    mostrarProcedimento(
        "Lanche",
        `

        <h2>
            🥪 Como lançar uma despesa de Lanche
        </h2>



        <h3>
            Passo 1
        </h3>

        <p>
            Clique em
            <strong>Criação do Manual de Despesa</strong>.
        </p>

        <img
            src="Imagens/Lanche da Tarde/1.png"
            alt="Criação do Manual de Despesa"
        >



        <h3>
            Passo 2
        </h3>

        <p>
            Pesquise por
            <strong>Lanche</strong>
            e selecione a opção correspondente.
        </p>

        <img
            src="Imagens/Lanche da Tarde/2.png"
            alt="Selecionar Lanche"
        >



        <h3>
            Passo 3
        </h3>

        <p>
            Preencha a
            <strong>data da transação</strong>,
            informe o
            <strong>valor da despesa</strong>
            e clique em
            <strong>Salvar</strong>.
        </p>

        <img
            src="Imagens/Lanche da Tarde/3.png"
            alt="Preencher data, valor e salvar despesa"
        >



        <div class="dica">

            💡 <strong>Importante</strong>

            <br><br>

            Conforme a <strong>RC-04/2026</strong>, é necessário apresentar
            <strong>comprovante fiscal</strong> para esta despesa.

            <br><br>

            O <strong>comprovante deve ser anexado em PDF</strong>.

        </div>

        `
    );

}


/* =========================================================
   LOCAÇÃO DE VEÍCULOS
========================================================= */

else if (tipo === "locacao") {

    document.title = "PASSA TRIP - Locação de Veículos";

    conteudo.innerHTML = `

        <h2>🚗 Como lançar uma despesa de Locação de Veículos</h2>


        <h3>Passo 1</h3>

        <p>
            Clique em <strong>Criação do Manual de Despesa</strong>.
        </p>

        <img
            src="Imagens/Locação de Veículos/1.png"
            alt="Criação do Manual de Despesa"
        >


        <h3>Passo 2</h3>

        <p>
            Na barra de pesquisa, pesquise por
            <strong>Locação de Veículos</strong> e selecione
            a opção correspondente.
        </p>

        <img
            src="Imagens/Locação de Veículos/2.png"
            alt="Selecionar Locação de Veículos"
        >


        <h3>Passo 3</h3>

        <p>
            Preencha os campos obrigatórios,
            como <strong>data da transação</strong>,
            <strong>valor</strong>
            e clique em
            <strong>Salvar</strong>.
        </p>

        <img
            src="Imagens/Locação de Veículos/3.png"
            alt="Preencher despesa de Locação de Veículos"
        >


    <div class="dica">

    💡 <strong>Importante</strong>

    <br><br>

    Conforme a <strong>RC-04/2026</strong>, a <strong>locação deve ser autorizada pelo GAF/CAF</strong>, desde que justificada e comprovada a <strong>economicidade</strong> ou a impossibilidade de uso de outros transportes.

    <br><br>

    Podem ser reembolsados <strong>seguro total e eventuais taxas</strong>, mediante documentos da locadora. 
    
     <br><br>

    O combustível deve ser lançado na <strong>despesa Combustível</strong>. 
    
    São aceitos documentos emitidos pela internet por empresas de locação on-line.

</div>

    `;

}

/* =========================================================
   OUTRAS DESPESAS DE VIAGENS
========================================================= */

else if (tipo === "outras") {

    document.title = "PASSA TRIP - Outras Despesas de Viagens";

    conteudo.innerHTML = `

        <h2>📦 Como lançar uma Despesa de ''Outras Despesas''</h2>

        <h3>Passo 1</h3>

        <p>
            Clique em <strong>Criação do Manual de Despesa</strong>.
        </p>

        <img
            src="Imagens/Outras Despesas/1.png"
            alt="Criação do Manual de Despesa"
        >

        <h3>Passo 2</h3>

        <p>
            Na barra de pesquisa, pesquise por
            <strong>Outras Despesas de Viagens</strong> e selecione
            a opção correspondente.
        </p>

        <img
            src="Imagens/Outras Despesas/2.png"
            alt="Selecionar Outras Despesas de Viagens"
        >

        <h3>Passo 3</h3>

        <p>
            Preencha os campos obrigatórios da despesa,

            <strong>valor</strong> e descreva no campo

        </p>

        <img

            alt="Preencher e salvar Outras Despesas de Viagens"
        >

        <div class="dica">

            💡 <strong>Importante</strong>

            <br><br>

            Conforme a <strong>RC-04/2026</strong>, é necessário
            <strong>anexar comprovante</strong> para esta despesa.

        </div>

    `;

}

/* =========================================================
   PEDÁGIO
========================================================= */

else if (tipo === "pedagio") {

    document.title = "PASSA TRIP - Pedágio";

    conteudo.innerHTML = `

        <h2>🛣️ Como lançar uma despesa de Pedágio</h2>

        <h3>Passo 1</h3>

        <p>
            Clique em <strong>Criação do Manual de Despesa</strong>.
        </p>

        <img
            src="Imagens/Pedágio/1.png"
            alt="Criação do Manual de Despesa"
        >

        <h3>Passo 2</h3>

        <p>
            Na barra de pesquisa, pesquise por
            <strong>Pedágio</strong> e selecione
            a opção correspondente.
        </p>

        <img
            src="Imagens/Pedágio/2.png"
            alt="Selecionar Pedágio"
        >

        <h3>Passo 3</h3>

        <p>

        </p>

        <img

            alt="Preencher e salvar despesa de Pedágio"
        >

        <div class="dica">

            💡 <strong>Importante</strong>

            <br><br>

            <strong>extratos de pedágios</strong>, contendo

            <br><br>

            justifique nos <strong>Comentários da Despesa</strong>.

        </div>

    `;

}

/* =========================================================
   QUILOMETRAGEM
========================================================= */

else if (tipo === "quilometragem") {

    mostrarProcedimento(
        "Quilometragem",
        `

        <h2>
            📍 Como lançar uma despesa de quilometragem
        </h2>


        <h3>
            Passo 1
        </h3>

        <p>
            Clique em
            <strong>Criação do Manual de Despesa</strong>.
        </p>

        <img
            src="Imagens/Quilometragem/1.png"
            alt="Criação do Manual de Despesa"
        >


        <h3>
            Passo 2
        </h3>

        <p>
            Pesquise por
            <strong>Quilometragem</strong>

        </p>

            Para habilitar outros campos, pressione <strong>TAB</strong> ou
            <strong>Enter</strong> no seu computador.
            Não se esqueça de calcular os trajetos e após isso clique em <strong>Adicionar Quilometragem ao Expense</strong>.

        <img

        </h3>

        </p>

        <img
            src="Imagens/Quilometragem/5.png"
            alt="Preencher data e finalidade da viagem"
        >


        <h3>
            Passo 6
        </h3>

            Este passo é para caso tenha esquecido de adicionar alguma rota após salvar a

/* =========================================================
   AMPLIAR IMAGEM
========================================================= */

function abrirImagem(imagem) {

    const modal =
        document.getElementById(
            "modal-imagem"
        );



    const imagemAmpliada =
        document.getElementById(
            "imagem-ampliada"
        );



    if (
        !modal ||
        !imagemAmpliada ||
        !imagem
    ) {

        return;

    }



    imagemAmpliada.src =
        imagem.currentSrc ||
        imagem.src;



    imagemAmpliada.alt =
        imagem.alt ||
        "Imagem ampliada";



    modal.classList.add(
        "aberta"
    );



    document.body.style.overflow =
        "hidden";

}



/* =========================================================
   FECHAR IMAGEM
========================================================= */

function fecharImagem() {

    const modal =
        document.getElementById(
            "modal-imagem"
        );



    const imagemAmpliada =
        document.getElementById(
            "imagem-ampliada"
        );



    if (!modal) {

        return;

    }



    modal.classList.remove(
        "aberta"
    );



    document.body.style.overflow =
        "";



    if (imagemAmpliada) {

        imagemAmpliada.src =
            "";

    }

}



/* =========================================================
   CLIQUE NAS IMAGENS
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const imagem =
            event.target.closest(
                "#conteudo-despesa img"
            );



        if (!imagem) {

            return;

        }



        event.preventDefault();



        abrirImagem(imagem);

    }
);



/* =========================================================
   FECHAR CLICANDO NO FUNDO
========================================================= */

const modalImagem =
    document.getElementById(
        "modal-imagem"
    );



if (modalImagem) {

    modalImagem.addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                fecharImagem();

            }

        }
    );

}



/* =========================================================
   FECHAR NO X
========================================================= */

const botaoFechar =
    document.getElementById(
        "fechar-imagem"
    );



if (botaoFechar) {

    botaoFechar.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();

            fecharImagem();

        }
    );

}



/* =========================================================
   NÃO FECHAR AO CLICAR NA IMAGEM AMPLIADA
========================================================= */

const imagemAmpliada =
    document.getElementById(
        "imagem-ampliada"
    );



if (imagemAmpliada) {

    imagemAmpliada.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

        }
    );

}



/* =========================================================
   FECHAR COM ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            fecharImagem();

        }

    }
);
