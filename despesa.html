<!DOCTYPE html>

<style>

/* =========================================================
IMAGENS DOS PROCEDIMENTOS
========================================================= */

#conteudo-despesa img {

    display: block;

    max-width: 100%;
    width: auto;
    height: auto;

    margin: 20px auto;

    cursor: zoom-in;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}

#conteudo-despesa img:hover {

    transform: scale(1.01);

    box-shadow:
        0 8px 24px rgba(16, 24, 40, 0.15);

}

/* =========================================================
IMAGEM AMPLIADA
========================================================= */

.modal-imagem {

    display: none;

    position: fixed;

    z-index: 9999;

    inset: 0;

    background: rgba(15, 23, 42, 0.88);

    align-items: center;

    justify-content: center;

    padding: 30px;

    cursor: zoom-out;

}

.modal-imagem img {

    max-width: 95vw;

    max-height: 92vh;

    width: auto;

    height: auto;

    object-fit: contain;

    border-radius: 10px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);

    background: #FFFFFF;

    cursor: zoom-out;

}

.fechar-imagem {

    position: absolute;

    top: 18px;

    right: 25px;

    color: #FFFFFF;

    font-size: 36px;

    font-weight: 700;

    cursor: pointer;

    line-height: 1;

}

</style>

</head>

<header>

<h1>PASSA TRIP</h1>

<p>Manual interativo do SAP Concur</p>

</header>

<div class="pagina-procedimento">

====================================================== -->

====================================================== -->

MODAL PARA AMPLIAR IMAGENS
========================================================= -->

    class="fechar-imagem"

        name="duvida"
        rows="8"
        placeholder="Digite sua dúvida aqui..."
        required
    ></textarea>

    <button
        type="submit"
        class="botao-enviar"
    >
        ➜
    </button>

</form>

<div class="dica">

    💡 Sua dúvida será enviada para a equipe de
    Prestação de Contas, que poderá entrar em contato
    pelo e-mail informado.

</div>

`;

const formulario =
document.getElementById("formulario-duvida");

formulario.addEventListener(
"submit",
function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const duvida =
        document.getElementById("duvida").value.trim();

    const destinatario =
        "contabilidadeprestacaodecontas@sesisenaisp.org.br";

    const assunto = duvida;

    const corpo =
        "Poderiam me ajudar com: " +
        duvida +
        "\n\n" +
        "E-mail para retorno: " +
        email;

    const linkEmail =
        "mailto:" +
        destinatario +
        "?subject=" +
        encodeURIComponent(assunto) +
        "&body=" +
        encodeURIComponent(corpo);

    window.location.href = linkEmail;

}

);

}

/* =========================================================
AMPLIAR IMAGEM
========================================================= */

function abrirImagem(imagem) {

const modal =
    document.getElementById("modal-imagem");

const imagemAmpliada =
    document.getElementById("imagem-ampliada");

if (!modal || !imagemAmpliada || !imagem) {

    return;

}

imagemAmpliada.src =
    imagem.currentSrc ||
    imagem.src;

imagemAmpliada.alt =
    imagem.alt || "Imagem ampliada";

modal.style.display =
    "flex";

document.body.style.overflow =
    "hidden";

}

/* =========================================================
FECHAR IMAGEM
========================================================= */

function fecharImagem() {

const modal =
    document.getElementById("modal-imagem");

const imagemAmpliada =
    document.getElementById("imagem-ampliada");

if (!modal) {

    return;

}

modal.style.display =
    "none";

document.body.style.overflow =
    "";

if (imagemAmpliada) {

    imagemAmpliada.src =
        "";

}

}

/* =========================================================
ATIVAR CLIQUE NAS IMAGENS
========================================================= */

document.addEventListener(
"click",
function(event) {

    const imagem =
        event.target.closest(
            "#conteudo-despesa img"
        );

    if (!imagem) {

        return;

    }

    event.preventDefault();

    abrirImagem(imagem);

}

);

/* =========================================================
FECHAR AO CLICAR FORA DA IMAGEM
========================================================= */

document.getElementById(
"modal-imagem"
).addEventListener(
"click",
function(event) {

    if (
        event.target === this ||
        event.target.classList.contains("fechar-imagem")
    ) {

        fecharImagem();

    }

}

);

/* =========================================================
FECHAR COM ESC
========================================================= */

document.addEventListener(
"keydown",
function(event) {

    if (event.key === "Escape") {

        fecharImagem();

    }

}

);

/* =========================================================
VOLTAR
========================================================= */

function voltarInicio() {

window.location.href =
    "index.html";

}
